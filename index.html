<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #14110F;
    --bg-glow: #2A1F16;
    --bg-modal: #1E1916;
    --accent-warm: #E8A854;
    --accent-highlight: #F472B6;
    --danger-color: #ef4444;
    --text-soft: #F5EDE3;
    --text-muted: #A89A8A;
    --tile-radius: 24px;
    
    /* Efeitos de TV */
    --focus-shadow: 0 20px 50px rgba(244, 114, 182, 0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-deep);
    font-family: 'Sora', sans-serif;
  }

  body {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  .glow {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 1400px;
    height: 900px;
    background: radial-gradient(ellipse at center, var(--bg-glow) 0%, transparent 65%);
    opacity: 0.9;
    pointer-events: none;
    z-index: 0;
  }

  .settings-btn {
    position: absolute;
    top: 36px;
    left: 48px;
    z-index: 2;
    background: rgba(255, 255, 255, 0.08);
    border: 2px solid rgba(255, 255, 255, 0.15);
    color: var(--text-soft);
    font-size: 24px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
  }

  .settings-btn:hover, .settings-btn:focus-visible {
    background: rgba(255, 255, 255, 0.2);
    transform: scale(1.2);
    outline: none;
    border-color: var(--accent-highlight);
    box-shadow: 0 0 25px rgba(244, 114, 182, 0.5);
  }

  .topbar {
    position: absolute;
    top: 36px;
    right: 48px;
    z-index: 2;
    text-align: right;
  }

  .clock {
    font-family: 'Sora', sans-serif;
    font-size: 32px;
    font-weight: 700;
    color: var(--text-soft);
    letter-spacing: 0.5px;
  }

  .date {
    font-size: 15px;
    color: var(--text-muted);
    margin-top: 2px;
    text-transform: capitalize;
  }

  .greeting-wrap {
    position: relative;
    z-index: 2;
    text-align: center;
    margin-bottom: 44px;
  }

  .greeting {
    font-family: 'Fredoka', sans-serif;
    font-weight: 500;
    font-size: 44px;
    color: var(--accent-warm);
  }

  .greeting span {
    color: var(--accent-highlight);
  }

  .subtext {
    font-family: 'Fredoka', sans-serif;
    font-size: 18px;
    color: var(--text-muted);
    margin-top: 8px;
  }

  .tiles {
    position: relative;
    z-index: 2;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 28px;
    max-width: 1280px;
    padding: 10px;
  }

  @keyframes popIn {
    0% { opacity: 0; transform: translateY(20px) scale(0.95); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  .tile {
    width: 180px;
    height: 180px;
    border-radius: var(--tile-radius);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: white;
    position: relative;
    overflow: hidden;
    transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.25s ease, border-color 0.25s ease;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    cursor: pointer;
    border: 3px solid transparent;
    opacity: 0;
    animation: popIn 0.4s ease forwards;
  }

  .tile::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(160deg, rgba(255,255,255,0.18), rgba(255,255,255,0) 45%);
    pointer-events: none;
  }

  /* Efeito Pop e Brilho de TV ao Focar */
  .tile:hover, .tile:focus-visible {
    transform: translateY(-8px) scale(1.12);
    box-shadow: var(--focus-shadow);
    outline: none;
    border-color: var(--accent-highlight);
    z-index: 10;
  }

  .tile-icon-img {
    width: 48px;
    height: 48px;
    object-fit: contain;
    margin-bottom: 12px;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
  }

  .tile-icon {
    font-family: 'Sora', sans-serif;
    font-weight: 800;
    font-size: 36px;
    line-height: 1;
    margin-bottom: 12px;
  }

  .tile-label {
    font-family: 'Sora', sans-serif;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.2px;
    text-align: center;
    padding: 0 10px;
    word-break: break-word;
  }

  .delete-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.5);
    color: rgba(255, 255, 255, 0.9);
    border: 1px solid rgba(255, 255, 255, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    cursor: pointer;
    z-index: 5;
    transition: all 0.2s ease;
  }

  .delete-btn:hover, .delete-btn:focus-visible {
    background: var(--danger-color);
    color: #ffffff;
    border-color: var(--danger-color);
    transform: scale(1.2);
    outline: none;
  }

  .tile-add {
    background: rgba(255, 255, 255, 0.05);
    border: 2px dashed rgba(255, 255, 255, 0.25);
    color: var(--text-muted);
  }
  
  .tile-add:hover, .tile-add:focus-visible {
    background: rgba(255, 255, 255, 0.12);
    color: var(--text-soft);
    border-style: solid;
  }

  .hint {
    position: relative;
    z-index: 2;
    margin-top: 40px;
    font-family: 'Fredoka', sans-serif;
    font-size: 16px;
    color: var(--text-muted);
    text-align: center;
  }

  .magic-text {
    position: absolute;
    bottom: 24px;
    left: 32px;
    font-family: 'Fredoka', sans-serif;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.3);
    z-index: 2;
    pointer-events: none;
    letter-spacing: 0.5px;
  }

  .modal-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(12px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 999;
  }

  .modal {
    background: var(--bg-modal);
    padding: 36px;
    border-radius: var(--tile-radius);
    width: 500px;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    color: var(--text-soft);
    border: 1px solid rgba(255,255,255,0.15);
  }

  .modal h2 {
    font-family: 'Fredoka', sans-serif;
    margin-bottom: 20px;
    color: var(--accent-highlight);
    text-align: center;
    font-size: 24px;
  }

  .modal label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    color: var(--text-muted);
  }

  .modal input {
    width: 100%;
    padding: 14px;
    margin-bottom: 18px;
    border-radius: 12px;
    border: 1px solid #3A2F28;
    background: #14110F;
    color: white;
    font-family: 'Sora', sans-serif;
    font-size: 15px;
  }

  .modal input:focus-visible {
    outline: 3px solid var(--accent-highlight);
    border-color: transparent;
  }

  /* Atalhos Rápidos dentro do Modal */
  .quick-apps-title {
    font-size: 13px;
    color: var(--accent-warm);
    margin-bottom: 10px;
    font-weight: 600;
  }

  .quick-apps-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }

  .quick-app-btn {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: var(--text-soft);
    padding: 10px;
    border-radius: 12px;
    cursor: pointer;
    font-family: 'Sora', sans-serif;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.2s ease;
  }

  .quick-app-btn:hover, .quick-app-btn:focus-visible {
    background: rgba(244, 114, 182, 0.2);
    border-color: var(--accent-highlight);
    transform: scale(1.05);
    outline: none;
  }

  .modal-buttons {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    margin-top: 10px;
  }

  .modal-btn {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    font-family: 'Sora', sans-serif;
    font-weight: 600;
    font-size: 15px;
    transition: transform 0.15s ease, background-color 0.15s ease;
  }

  .modal-btn:focus-visible {
    outline: 3px solid white;
    transform: scale(1.03);
  }

  .btn-cancel { background: #3A2F28; color: white; }
  .btn-save { background: var(--accent-highlight); color: #FFF; }

  /* Descanso de Tela Anti-Burn-in */
  #screensaver {
    position: fixed; inset: 0; background: #000;
    z-index: 9999; display: none;
    justify-content: center; align-items: center;
    opacity: 0; transition: opacity 1s ease;
  }
  
  #screensaver.active { display: flex; opacity: 1; }

  #screensaver-clock {
    font-size: 110px; font-weight: 800; color: rgba(255,255,255,0.25);
    font-family: 'Sora', sans-serif;
    animation: floatingClock 12s ease infinite alternate;
  }

  @keyframes floatingClock {
    0% { transform: translate(-120px, -60px); }
    100% { transform: translate(120px, 60px); }
  }

  @media (max-width: 900px) {
    .tile { width: 140px; height: 140px; }
    .tile-icon-img { width: 36px; height: 36px; }
    .tile-icon { font-size: 28px; }
  }
</style>
</head>
<body>

  <div class="glow"></div>

  <button class="settings-btn" onclick="openSettingsModal()" title="Configurações" tabindex="0">⚙️</button>

  <div class="topbar">
    <div class="clock" id="clock">--:--</div>
    <div class="date" id="date">--</div>
  </div>

  <div class="greeting-wrap">
    <div class="greeting" id="greeting">Boa tarde, <span>Mãe!</span></div>
    <div class="subtext">O que você quer assistir hoje?</div>
  </div>

  <div class="tiles" id="tiles"></div>

  <div class="hint">Navegue pelas setas do controle e aperte OK para selecionar</div>

  <div class="magic-text">Essa é a magia da programação</div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2>Adicionar Novo Link</h2>

      <div class="quick-apps-title">⚡ Adicionar rápido (Sugestões):</div>
      <div class="quick-apps-grid">
        <button class="quick-app-btn" onclick="quickAddApp('Disney+', 'https://www.disneyplus.com')">✨ Disney+</button>
        <button class="quick-app-btn" onclick="quickAddApp('Prime Video', 'https://www.primevideo.com')">🎬 Prime</button>
        <button class="quick-app-btn" onclick="quickAddApp('Spotify', 'https://open.spotify.com')">🎵 Spotify</button>
        <button class="quick-app-btn" onclick="quickAddApp('Pluto TV', 'https://pluto.tv')">📺 Pluto TV</button>
        <button class="quick-app-btn" onclick="quickAddApp('Receitas', 'https://www.tudogostoso.com.br')">🍳 Receitas</button>
        <button class="quick-app-btn" onclick="quickAddApp('Twitch', 'https://www.twitch.tv')">💜 Twitch</button>
      </div>

      <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin-bottom: 18px;">

      <label for="appName">Ou digite o Nome do Aplicativo:</label>
      <input type="text" id="appName" placeholder="Ex: Receitas">
      <label for="appUrl">Endereço (URL):</label>
      <input type="text" id="appUrl" placeholder="Ex: youtube.com">
      <div class="modal-buttons">
        <button class="modal-btn btn-cancel" onclick="closeModal()">Cancelar</button>
        <button class="modal-btn btn-save" onclick="saveApp()">Salvar</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="settingsModalOverlay">
    <div class="modal">
      <h2>⚙️ Configurações</h2>
      <label for="userNameInput">Nome de usuário:</label>
      <input type="text" id="userNameInput" placeholder="Ex: Mãe">
      <div class="modal-buttons">
        <button class="modal-btn btn-cancel" onclick="closeSettingsModal()">Cancelar</button>
        <button class="modal-btn btn-save" onclick="saveSettings()">Salvar</button>
      </div>
    </div>
  </div>

  <div id="screensaver">
      <div id="screensaver-clock">--:--</div>
  </div>

<script>
  const DEFAULT_APPS = [
    { name: "Netflix",     url: "https://www.netflix.com",        initial: "N", grad: ["#C11119", "#7A0A10"] },
    { name: "YouTube",     url: "https://www.youtube.com",        initial: "▶", grad: ["#E8342A", "#8E1A14"] },
    { name: "Globoplay",   url: "https://globoplay.globo.com",   initial: "G", grad: ["#E4265A", "#7A0F30"] },
    { name: "SBT",         url: "https://www.sbt.com.br/ao-vivo", initial: "S", grad: ["#1450A3", "#0A2C5C"] },
    { name: "Internet",    url: "https://www.google.com",         initial: "🌐", grad: ["#E8A854", "#8A5A1E"] },
  ];

  const tilesEl = document.getElementById('tiles');
  const modal = document.getElementById('modalOverlay');
  const settingsModal = document.getElementById('settingsModalOverlay');
  const screensaverEl = document.getElementById('screensaver');

  const gradients = [
    ["#6b21a8", "#3b0764"],
