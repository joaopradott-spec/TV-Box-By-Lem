<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #14110F;
    --bg-glow: #2A1F16;
    --bg-modal: #1E1916;
    --accent-warm: #E8A854;
    --accent-highlight: #F472B6;
    --danger-color: #ef4444;
    --text-soft: #F5EDE3;
    --text-muted: #A89A8A;
    --tile-radius: 24px;
  }

  /* Temas de Cores */
  body.theme-warm {
    --bg-deep: #14110F;
    --bg-glow: #2A1F16;
    --accent-warm: #E8A854;
    --accent-highlight: #F472B6;
  }
  body.theme-emerald {
    --bg-deep: #061410;
    --bg-glow: #0F2A22;
    --accent-warm: #34D399;
    --accent-highlight: #6EE7B7;
  }
  body.theme-neon {
    --bg-deep: #0B0A14;
    --bg-glow: #1C1936;
    --accent-warm: #818CF8;
    --accent-highlight: #C084FC;
  }
  body.theme-sunset {
    --bg-deep: #1A0F14;
    --bg-glow: #381A28;
    --accent-warm: #FB923C;
    --accent-highlight: #F43F5E;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-deep);
    font-family: 'Sora', sans-serif;
    transition: background 0.4s ease;
  }

  body {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  .glow {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 1400px;
    height: 900px;
    background: radial-gradient(ellipse at center, var(--bg-glow) 0%, transparent 65%);
    opacity: 0.9;
    pointer-events: none;
    z-index: 0;
    transition: background 0.4s ease;
  }

  .settings-btn {
    position: absolute;
    top: 36px;
    left: 48px;
    z-index: 2;
    background: rgba(255, 255, 255, 0.08);
    border: 2px solid rgba(255, 255, 255, 0.15);
    color: var(--text-soft);
    font-size: 24px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.2s ease, border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
  }

  .settings-btn:hover, .settings-btn:focus-visible {
    background: rgba(255, 255, 255, 0.2);
    transform: scale(1.15);
    outline: none;
    border-color: var(--accent-highlight);
    box-shadow: 0 0 20px var(--accent-highlight);
  }

  .topbar {
    position: absolute;
    top: 36px;
    right: 48px;
    z-index: 2;
    text-align: right;
    display: flex;
    align-items: flex-start;
    gap: 24px;
  }

  .weather-widget {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 10px 16px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--text-soft);
  }

  .weather-icon { font-size: 26px; }
  .weather-info .temp { font-size: 18px; font-weight: 700; color: var(--accent-warm); }
  .weather-info .cond { font-size: 12px; color: var(--text-muted); }

  .clock-container { text-align: right; }

  .clock {
    font-family: 'Sora', sans-serif;
    font-size: 32px;
    font-weight: 700;
    color: var(--text-soft);
    letter-spacing: 0.5px;
  }

  .date {
    font-size: 15px;
    color: var(--text-muted);
    margin-top: 2px;
    text-transform: capitalize;
  }

  .greeting-wrap {
    position: relative;
    z-index: 2;
    text-align: center;
    margin-bottom: 44px;
  }

  .greeting {
    font-family: 'Fredoka', sans-serif;
    font-weight: 500;
    font-size: 44px;
    color: var(--accent-warm);
    transition: color 0.3s ease;
  }

  .greeting span {
    color: var(--accent-highlight);
    transition: color 0.3s ease;
  }

  .subtext {
    font-family: 'Fredoka', sans-serif;
    font-size: 18px;
    color: var(--text-muted);
    margin-top: 8px;
  }

  .tiles {
    position: relative;
    z-index: 2;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 28px;
    max-width: 1280px;
    padding: 10px;
  }

  @keyframes popIn {
    0% { opacity: 0; transform: translateY(20px) scale(0.95); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  .tile {
    width: 180px;
    height: 180px;
    border-radius: var(--tile-radius);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: white;
    position: relative;
    overflow: hidden;
    transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    cursor: pointer;
    border: 3px solid transparent;
    opacity: 0;
    animation: popIn 0.4s ease forwards;
  }

  .tile[draggable="true"] { cursor: grab; }
  .tile.dragging { opacity: 0.4; cursor: grabbing; }
  .tile.drag-over { outline: 3px dashed var(--accent-highlight); outline-offset: 4px; }

  .tile::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(160deg, rgba(255,255,255,0.18), rgba(255,255,255,0) 45%);
    pointer-events: none;
  }

  .tile:hover, .tile:focus-visible {
    transform: translateY(-8px) scale(1.08);
    box-shadow: 0 0 30px var(--accent-highlight), 0 20px 45px rgba(0,0,0,0.6);
    outline: none;
    border-color: var(--accent-highlight);
    z-index: 10;
  }

  .tile-icon-img {
    width: 48px;
    height: 48px;
    object-fit: contain;
    margin-bottom: 12px;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
  }

  .tile-icon {
    font-family: 'Sora', sans-serif;
    font-weight: 800;
    font-size: 36px;
    line-height: 1;
    margin-bottom: 12px;
  }

  .tile-label {
    font-family: 'Sora', sans-serif;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.2px;
    text-align: center;
    padding: 0 10px;
    word-break: break-word;
  }

  .tile-actions {
    position: absolute;
    top: 8px;
    right: 8px;
    display: flex;
    gap: 4px;
    z-index: 5;
  }

  .action-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.6);
    color: rgba(255, 255, 255, 0.9);
    border: 1px solid rgba(255, 255, 255, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .action-btn:hover, .action-btn:focus-visible {
    background: var(--accent-highlight);
    color: #ffffff;
    border-color: var(--accent-highlight);
    transform: scale(1.15);
    outline: none;
  }

  .action-btn.delete:hover {
    background: var(--danger-color);
    border-color: var(--danger-color);
  }

  .tile-add {
    background: rgba(255, 255, 255, 0.05);
    border: 2px dashed rgba(255, 255, 255, 0.25);
    color: var(--text-muted);
  }
  
  .tile-add:hover, .tile-add:focus-visible {
    background: rgba(255, 255, 255, 0.12);
    color: var(--text-soft);
    border-style: solid;
  }

  .hint {
    position: relative;
    z-index: 2;
    margin-top: 40px;
    font-family: 'Fredoka', sans-serif;
    font-size: 16px;
    color: var(--text-muted);
    text-align: center;
  }

  .magic-text {
    position: absolute;
    bottom: 24px;
    left: 32px;
    font-family: 'Fredoka', sans-serif;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.3);
    z-index: 2;
    pointer-events: none;
    letter-spacing: 0.5px;
  }

  /* Tela de Transição Fullscreen de Carregamento */
  #launchScreen {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  #launchScreen.active {
    display: flex;
    opacity: 1;
  }
  .ls-icon-img {
    width: 100px;
    height: 100px;
    object-fit: contain;
    margin-bottom: 24px;
    filter: drop-shadow(0 8px 16px rgba(0,0,0,0.5));
    animation: pulseIcon 1.2s infinite alternate;
  }
  .ls-icon {
    font-size: 80px;
    font-weight: 800;
    margin-bottom: 24px;
    animation: pulseIcon 1.2s infinite alternate;
  }
  .ls-label {
    font-size: 32px;
    font-weight: 800;
    margin-bottom: 40px;
    letter-spacing: 0.5px;
  }
  .spinner {
    width: 50px;
    height: 50px;
    border: 5px solid rgba(255,255,255,0.2);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  @keyframes pulseIcon {
    0% { transform: scale(1); }
    100% { transform: scale(1.08); }
  }

  /* Modais */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(8px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 999;
  }

  .modal {
    background: var(--bg-modal);
    padding: 36px;
    border-radius: var(--tile-radius);
    width: 440px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    color: var(--text-soft);
    border: 1px solid rgba(255,255,255,0.15);
  }

  .modal h2 {
    font-family: 'Fredoka', sans-serif;
    margin-bottom: 24px;
    color: var(--accent-highlight);
    text-align: center;
    font-size: 24px;
  }

  .modal label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    color: var(--text-muted);
  }

  .modal input, .modal select {
    width: 100%;
    padding: 14px;
    margin-bottom: 18px;
    border-radius: 12px;
    border: 1px solid #3A2F28;
    background: #14110F;
    color: white;
    font-family: 'Sora', sans-serif;
    font-size: 15px;
  }

  .modal input:focus-visible, .modal select:focus-visible {
    outline: 3px solid var(--accent-highlight);
    border-color: transparent;
  }

  .modal-buttons {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    margin-top: 10px;
  }

  .modal-btn {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    font-family: 'Sora', sans-serif;
    font-weight: 600;
    font-size: 15px;
    transition: transform 0.15s ease, background-color 0.15s ease;
  }

  .modal-btn:focus-visible {
    outline: 3px solid white;
    transform: scale(1.03);
  }

  .btn-cancel { background: #3A2F28; color: white; }
  .btn-save { background: var(--accent-highlight); color: #FFF; }
  .btn-danger { background: var(--danger-color); color: #FFF; width: 100%; margin-top: 4px; }

  .inline-row {
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .inline-row input { margin-bottom: 18px; }
  .inline-row button {
    flex: 0 0 auto;
    padding: 14px 18px;
    border-radius: 12px;
    border: none;
    background: var(--accent-highlight);
    color: white;
    font-weight: 700;
    cursor: pointer;
    height: 52px;
  }

  .color-swatches {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 18px;
  }
  .swatch {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    border: 3px solid transparent;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .swatch:hover, .swatch:focus-visible { transform: scale(1.15); outline: none; }
  .swatch.selected { border-color: white; box-shadow: 0 0 0 2px var(--accent-highlight); }
  .swatch.random {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #3A2F28;
    font-size: 16px;
  }

  hr.modal-divider {
    border: none;
    border-top: 1px solid rgba(255,255,255,0.12);
    margin: 8px 0 20px 0;
  }

  /* Modo Descanso / Screensaver */
  #screensaver {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 99999;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    opacity: 0;
    transition: opacity 1s ease;
  }
  #screensaver.active { display: flex; opacity: 1; }
  .ss-clock { font-size: 96px; font-weight: 800; color: var(--text-soft); font-family: 'Sora', sans-serif; }
  .ss-date { font-size: 24px; color: var(--text-muted); margin-top: 10px; font-family: 'Fredoka', sans-serif; }

  @media (max-width: 900px) {
    .tile { width: 140px; height: 140px; }
    .tile-icon-img { width: 36px; height: 36px; }
    .tile-icon { font-size: 28px; }
  }
</style>
</head>
<body class="theme-warm">

  <div class="glow"></div>

  <button class="settings-btn" onclick="openSettingsModal()" title="Configurações">⚙️</button>

  <div class="topbar">
    <div class="weather-widget" id="weatherWidget" title="Clima Atual">
      <div class="weather-icon" id="weatherIcon">⛅</div>
      <div class="weather-info">
        <div class="temp" id="weatherTemp">--°C</div>
        <div class="cond" id="weatherCond">Carregando...</div>
      </div>
    </div>
    <div class="clock-container">
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date">--</div>
    </div>
  </div>

  <div class="greeting-wrap">
    <div class="greeting" id="greeting">Boa tarde, <span>Usuario!</span></div>
    <div class="subtext">O que você quer assistir hoje? Arraste os cards ou use as setas para reorganizar.</div>
  </div>

  <div class="tiles" id="tiles"></div>

  <div class="hint">Aperte Enter / OK para abrir o app, arraste para reordenar, ou use ◀▶</div>

  <div class="magic-text">Essa é a magia da programação</div>

  <div id="launchScreen">
    <div id="lsContent" style="display:flex; flex-direction:column; align-items:center;"></div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2 id="modalTitle">Adicionar Novo Link</h2>
      <input type="hidden" id="editIndex" value="">
      <label for="appName">Nome do Aplicativo:</label>
      <input type="text" id="appName" placeholder="Ex: Receitas">
      <label for="appUrl">Endereço (URL):</label>
      <input type="text" id="appUrl" placeholder="Ex: https://youtube.com">
      <label for="appIcon">Ícone (emoji ou letra — opcional):</label>
      <input type="text" id="appIcon" placeholder="Deixe em branco para usar a 1ª letra do nome" maxlength="2">
      <label>Cor do tile (usada se o ícone do site não carregar):</label>
      <div class="color-swatches" id="colorSwatches"></div>
      <input type="hidden" id="appColorIndex" value="-1">
      <div class="modal-buttons">
        <button class="modal-btn btn-cancel" onclick="closeModal()">Cancelar</button>
        <button class="modal-btn btn-save" onclick="saveApp()">Salvar</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="settingsModalOverlay">
    <div class="modal">
      <h2>⚙️ Configurações</h2>

      <label for="profileSelect">Perfil ativo:</label>
      <select id="profileSelect" onchange="onProfileSelectChange()"></select>

      <label for="userNameInput">Nome de usuário (deste perfil):</label>
      <input type="text" id="userNameInput" placeholder="Ex: jorge">

      <label for="themeSelect">Tema de Cores (deste perfil):</label>
      <select id="themeSelect">
        <option value="theme-warm">Café Quente (Padrão)</option>
        <option value="theme-emerald">Verde Esmeralda</option>
        <option value="theme-neon">Roxo Neon</option>
        <option value="theme-sunset">Pôr do Sol</option>
      </select>

      <hr class="modal-divider">

      <label for="newProfileName">Criar novo perfil:</label>
      <div class="inline-row">
        <input type="text" id="newProfileName" placeholder="Nome do novo perfil">
        <button type="button" onclick="createProfile()">+</button>
      </div>

      <button class="modal-btn btn-danger" id="deleteProfileBtn" onclick="deleteCurrentProfile()">Excluir este perfil</button>

      <div class="modal-buttons">
        <button class="modal-btn btn-cancel" onclick="closeSettingsModal()">Fechar</button>
        <button class="modal-btn btn-save" onclick="saveSettings()">Salvar</button>
      </div>
    </div>
  </div>

  <div id="screensaver" onclick="dismissScreensaver()">
    <div class="ss-clock" id="ssClock">--:--</div>
    <div class="ss-date" id="ssDate">--</div>
  </div>

<script>
  // ===== Dados padrão de apps (usados para novos perfis / migração) =====
  const defaultAppsList = [
    { name: "Netflix",     url: "https://www.netflix.com",        initial: "N", grad: ["#C11119", "#7A0A10"], isDefault: true },
    { name: "YouTube",     url: "https://www.youtube.com",        initial: "▶", grad: ["#E8342A", "#8E1A14"], isDefault: true },
    { name: "Globoplay",   url: "https://globoplay.globo.com",   initial: "G", grad: ["#E4265A", "#7A0F30"], isDefault: true },
    { name: "SBT",         url: "https://www.sbt.com.br/ao-vivo", initial: "S", grad: ["#1450A3", "#0A2C5C"], isDefault: true },
    { name: "Internet",    url: "https://www.google.com",         initial: "🌐", grad: ["#E8A854", "#8A5A1E"], isDefault: true },
  ];

  const gradients = [
    ["#6b21a8", "#3b0764"], ["#047857", "#064e3b"], 
    ["#be123c", "#881337"], ["#1d4ed8", "#1e3a8a"],
    ["#b45309", "#78350f"], ["#4338ca", "#312e81"],
    ["#be185d", "#831843"]
  ];

  // ===== Perfis (nome, tema e atalhos separados por pessoa) =====
  const PROFILES_KEY = 'tvProfilesData';
  // Chaves antigas, usadas só para migrar dados de uma versão sem perfis
  const LEGACY_APPS_KEY = 'tvAppsLayout';
  const LEGACY_NAME_KEY = 'tvUserName';
  const LEGACY_THEME_KEY = 'tvTheme';

  function loadProfilesData() {
    const raw = localStorage.getItem(PROFILES_KEY);
    if (raw) {
      try { return JSON.parse(raw); } catch {}
    }

    // Migração: se já existia um layout salvo no formato antigo, aproveita ele
    let legacyApps = null;
    try {
      const legacyRaw = localStorage.getItem(LEGACY_APPS_KEY);
      legacyApps = legacyRaw ? JSON.parse(legacyRaw) : null;
    } catch { legacyApps = null; }
    if (!legacyApps) legacyApps = JSON.parse(JSON.stringify(defaultAppsList));

    const data = {
      activeProfileId: 'p1',
      profiles: {
        p1: {
          name: localStorage.getItem(LEGACY_NAME_KEY) || 'Mãe!',
          theme: localStorage.getItem(LEGACY_THEME_KEY) || 'theme-warm',
          apps: legacyApps
        }
      }
    };
    saveProfilesData(data);
    return data;
  }

  function saveProfilesData(data) {
    localStorage.setItem(PROFILES_KEY, JSON.stringify(data));
  }

  let profilesData = loadProfilesData();

  function getActiveProfile() {
    return profilesData.profiles[profilesData.activeProfileId];
  }

  function getApps() {
    return getActiveProfile().apps;
  }

  function saveApps(apps) {
    getActiveProfile().apps = apps;
    saveProfilesData(profilesData);
  }

  const tilesEl = document.getElementById('tiles');
  const modal = document.getElementById('modalOverlay');
  const settingsModal = document.getElementById('settingsModalOverlay');
  const screensaver = document.getElementById('screensaver');
  const launchScreen = document.getElementById('launchScreen');

  let idleTimer = null;
  const IDLE_TIME_LIMIT = 120000;
  let dragSrcIndex = null;

  // Web Audio API para sons refinados
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  
  function playSound(type) {
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'move') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(400, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.05);
      gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    } else if (type === 'click') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(180, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.06);
      gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.06);
    }
  }

  function getFaviconUrl(url) {
    try {
      const domain = new URL(url).hostname;
      return `https://www.google.com/s2/favicons?domain=${domain}&sz=128`;
    } catch {
      return '';
    }
  }

  function createTileContent(app) {
    const faviconUrl = getFaviconUrl(app.url);
    return `
      ${faviconUrl ? `<img src="${faviconUrl}" alt="" class="tile-icon-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">` : ''}
      <div class="tile-icon" style="${faviconUrl ? 'display:none;' : ''}">${app.initial}</div>
      <div class="tile-label">${app.name}</div>
    `;
  }

  function launchApp(app) {
    playSound('click');
    const faviconUrl = getFaviconUrl(app.url);
    
    launchScreen.style.background = `linear-gradient(160deg, ${app.grad[0]}, ${app.grad[1]})`;
    
    const lsContent = document.getElementById('lsContent');
    lsContent.innerHTML = `
      ${faviconUrl ? `<img src="${faviconUrl}" alt="" class="ls-icon-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">` : ''}
      <div class="ls-icon" style="${faviconUrl ? 'display:none;' : ''}">${app.initial}</div>
      <div class="ls-label">${app.name}</div>
      <div class="spinner"></div>
    `;

    launchScreen.classList.add('active');

    setTimeout(() => {
      window.location.href = app.url;
    }, 1200);
  }

  function renderApps() {
    tilesEl.innerHTML = ''; 
    const apps = getApps();

    apps.forEach((app, i) => {
      const a = document.createElement('div');
      a.className = 'tile';
      a.tabIndex = 0;
      a.draggable = true;
      a.dataset.index = i;
      a.style.animationDelay = `${i * 0.05}s`;
      a.style.background = `linear-gradient(160deg, ${app.grad[0]}, ${app.grad[1]})`;
      
      let actionsHtml = `
        <div class="tile-actions">
          <button class="action-btn" onclick="moveApp(${i}, -1, event)" title="Mover para esquerda">◀</button>
          <button class="action-btn" onclick="moveApp(${i}, 1, event)" title="Mover para direita">▶</button>
      `;

      if (!app.isDefault) {
        actionsHtml += `
          <button class="action-btn delete" onclick="deleteApp(${i}, event)" title="Remover">✕</button>
          <button class="action-btn" onclick="openEditModal(${i}, event)" title="Editar">✏️</button>
        `;
      }
      actionsHtml += `</div>`;

      a.innerHTML = actionsHtml + createTileContent(app);

      a.onfocus = () => playSound('move');
      a.onclick = (e) => {
        if (e.target.closest('.tile-actions')) return;
        launchApp(app);
      };

      // Reordenar por arrastar (mouse/touch em navegadores comuns)
      a.addEventListener('dragstart', handleDragStart);
      a.addEventListener('dragover', handleDragOver);
      a.addEventListener('dragleave', handleDragLeave);
      a.addEventListener('drop', handleDrop);
      a.addEventListener('dragend', handleDragEnd);

      tilesEl.appendChild(a);
    });

    const addBtn = document.createElement('button');
    addBtn.className = 'tile tile-add';
    addBtn.tabIndex = 0;
    addBtn.style.animationDelay = `${apps.length * 0.05}s`;
    addBtn.onfocus = () => playSound('move');
    addBtn.onclick = openModal;
    addBtn.innerHTML = `<div class="tile-icon">➕</div><div class="tile-label">Adicionar</div>`;
    tilesEl.appendChild(addBtn);
  }

  // ===== Drag-and-drop =====
  function handleDragStart(e) {
    dragSrcIndex = parseInt(this.dataset.index);
    this.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', String(dragSrcIndex)); } catch {}
  }

  function handleDragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    this.classList.add('drag-over');
  }

  function handleDragLeave() {
    this.classList.remove('drag-over');
  }

  function handleDrop(e) {
    e.preventDefault();
    this.classList.remove('drag-over');
    const targetIndex = parseInt(this.dataset.index);
    if (dragSrcIndex === null || isNaN(targetIndex) || targetIndex === dragSrcIndex) return;

    let apps = getApps();
    const [moved] = apps.splice(dragSrcIndex, 1);
    apps.splice(targetIndex, 0, moved);
    saveApps(apps);
    renderApps();
    playSound('click');
  }

  function handleDragEnd() {
    this.classList.remove('dragging');
    document.querySelectorAll('.tile.drag-over').forEach(el => el.classList.remove('drag-over'));
    dragSrcIndex = null;
  }

  // Botões ◀▶ continuam funcionando (essenciais pra quem usa controle remoto)
  function moveApp(index, direction, event) {
    event.preventDefault();
    event.stopPropagation();
    playSound('click');

    let apps = getApps();
    const targetIndex = index + direction;

    if (targetIndex >= 0 && targetIndex < apps.length) {
      const temp = apps[index];
      apps[index] = apps[targetIndex];
      apps[targetIndex] = temp;
      saveApps(apps);
      renderApps();
    }
  }

  // ===== Modal Adicionar/Editar app =====
  function renderColorSwatches(selectedGrad) {
    const container = document.getElementById('colorSwatches');
    container.innerHTML = '';
    document.getElementById('appColorIndex').value = '-1';

    gradients.forEach((grad, i) => {
      const sw = document.createElement('div');
      sw.className = 'swatch';
      sw.tabIndex = 0;
      sw.style.background = `linear-gradient(160deg, ${grad[0]}, ${grad[1]})`;
      sw.title = 'Escolher esta cor';
      if (selectedGrad && selectedGrad[0] === grad[0] && selectedGrad[1] === grad[1]) {
        sw.classList.add('selected');
        document.getElementById('appColorIndex').value = i;
      }
      sw.onclick = () => selectSwatch(i, sw);
      sw.onkeydown = (e) => { if (e.key === 'Enter') selectSwatch(i, sw); };
      container.appendChild(sw);
    });

    const randomSw = document.createElement('div');
    randomSw.className = 'swatch random';
    randomSw.tabIndex = 0;
    randomSw.title = 'Cor aleatória';
    randomSw.textContent = '🎲';
    randomSw.onclick = () => selectSwatch(-1, randomSw);
    randomSw.onkeydown = (e) => { if (e.key === 'Enter') selectSwatch(-1, randomSw); };
    container.appendChild(randomSw);
  }

  function selectSwatch(index, el) {
    playSound('move');
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
    el.classList.add('selected');
    document.getElementById('appColorIndex').value = index;
  }

  function openModal() {
    playSound('click');
    document.getElementById('modalTitle').textContent = "Adicionar Novo Link";
    document.getElementById('editIndex').value = '';
    document.getElementById('appName').value = '';
    document.getElementById('appUrl').value = '';
    document.getElementById('appIcon').value = '';
    renderColorSwatches(null);
    modal.style.display = 'flex';
    document.getElementById('appName').focus();
  }

  function openEditModal(index, event) {
    event.preventDefault();
    event.stopPropagation();
    playSound('click');
    
    let apps = getApps();
    const app = apps[index];

    document.getElementById('modalTitle').textContent = "Editar Link";
    document.getElementById('editIndex').value = index;
    document.getElementById('appName').value = app.name;
    document.getElementById('appUrl').value = app.url;
    document.getElementById('appIcon').value = app.initial || '';
    renderColorSwatches(app.grad);
    modal.style.display = 'flex';
    document.getElementById('appName').focus();
  }

  function closeModal() {
    playSound('click');
    modal.style.display = 'none';
    const firstTile = tilesEl.querySelector('.tile');
    if (firstTile) firstTile.focus();
  }

  function saveApp() {
    const name = document.getElementById('appName').value.trim();
    let url = document.getElementById('appUrl').value.trim();
    const editIndexVal = document.getElementById('editIndex').value;
    const manualIcon = document.getElementById('appIcon').value.trim();
    const colorIndexVal = parseInt(document.getElementById('appColorIndex').value);

    if (!name || !url) {
      alert("Por favor, preencha o nome e a URL.");
      return;
    }

    if (!/^https?:\/\//i.test(url)) {
      url = 'https://' + url;
    }

    let apps = getApps();
    const chosenGrad = (!isNaN(colorIndexVal) && colorIndexVal >= 0 && colorIndexVal < gradients.length)
      ? gradients[colorIndexVal]
      : null;

    if (editIndexVal !== '') {
      const idx = parseInt(editIndexVal);
      apps[idx].name = name;
      apps[idx].url = url;
      apps[idx].initial = manualIcon || name.charAt(0).toUpperCase();
      if (chosenGrad) apps[idx].grad = chosenGrad;
    } else {
      const initial = manualIcon || name.charAt(0).toUpperCase();
      const grad = chosenGrad || gradients[Math.floor(Math.random() * gradients.length)];
      apps.push({ name, url, initial, grad, isDefault: false });
    }

    saveApps(apps);
    closeModal();
    renderApps();
  }

  function deleteApp(index, event) {
    event.preventDefault();
    event.stopPropagation();
    
    if (confirm("Deseja remover este atalho da lista?")) {
      playSound('click');
      let apps = getApps();
      apps.splice(index, 1);
      saveApps(apps);
      renderApps();
    }
  }

  // ===== Modal de Configurações / Perfis =====
  function populateProfileSelect() {
    const sel = document.getElementById('profileSelect');
    sel.innerHTML = '';
    Object.keys(profilesData.profiles).forEach(id => {
      const opt = document.createElement('option');
      opt.value = id;
      opt.textContent = profilesData.profiles[id].name;
      if (id === profilesData.activeProfileId) opt.selected = true;
      sel.appendChild(opt);
    });
    document.getElementById('deleteProfileBtn').style.display =
      Object.keys(profilesData.profiles).length > 1 ? 'block' : 'none';
  }

  function onProfileSelectChange() {
    playSound('click');
    const sel = document.getElementById('profileSelect');
    profilesData.activeProfileId = sel.value;
    saveProfilesData(profilesData);

    const profile = getActiveProfile();
    document.getElementById('userNameInput').value = profile.name;
    document.getElementById('themeSelect').value = profile.theme;
    applyTheme(profile.theme);
    renderApps();
    updateClock();
  }

  function createProfile() {
    playSound('click');
    const input = document.getElementById('newProfileName');
    const name = input.value.trim();
    if (!name) { alert('Digite um nome para o novo perfil.'); return; }

    const id = 'p' + Date.now();
    profilesData.profiles[id] = {
      name,
      theme: 'theme-warm',
      apps: JSON.parse(JSON.stringify(defaultAppsList))
    };
    profilesData.activeProfileId = id;
    saveProfilesData(profilesData);

    input.value = '';
    populateProfileSelect();
    document.getElementById('userNameInput').value = name;
    document.getElementById('themeSelect').value = 'theme-warm';
    applyTheme('theme-warm');
    renderApps();
    updateClock();
  }

  function deleteCurrentProfile() {
    const ids = Object.keys(profilesData.profiles);
    if (ids.length <= 1) {
      alert('Não é possível excluir o único perfil existente.');
      return;
    }
    if (!confirm(`Excluir o perfil "${getActiveProfile().name}" e todos os seus atalhos?`)) return;

    playSound('click');
    delete profilesData.profiles[profilesData.activeProfileId];
    profilesData.activeProfileId = Object.keys(profilesData.profiles)[0];
    saveProfilesData(profilesData);

    const profile = getActiveProfile();
    document.getElementById('userNameInput').value = profile.name;
    document.getElementById('themeSelect').value = profile.theme;
    applyTheme(profile.theme);
    populateProfileSelect();
    renderApps();
    updateClock();
  }

  function openSettingsModal() {
    playSound('click');
    populateProfileSelect();
    const profile = getActiveProfile();
    document.getElementById('userNameInput').value = profile.name;
    document.getElementById('themeSelect').value = profile.theme;

    settingsModal.style.display = 'flex';
    document.getElementById('userNameInput').focus();
  }

  function closeSettingsModal() {
    playSound('click');
    settingsModal.style.display = 'none';
    document.querySelector('.settings-btn').focus();
  }

  function saveSettings() {
    playSound('click');
    const newName = document.getElementById('userNameInput').value.trim();
    const profile = getActiveProfile();
    profile.name = newName || profile.name;
    profile.theme = document.getElementById('themeSelect').value;
    saveProfilesData(profilesData);

    applyTheme(profile.theme);
    populateProfileSelect();
    closeSettingsModal();
    updateClock();
  }

  function applyTheme(themeClass) {
    document.body.className = themeClass;
  }

  // ===== Clima (com cache local pra não ficar "Carregando..." toda hora) =====
  const WEATHER_CACHE_KEY = 'tvWeatherCache';

  function loadCachedWeather() {
    const raw = localStorage.getItem(WEATHER_CACHE_KEY);
    if (!raw) return;
    try {
      const cached = JSON.parse(raw);
      document.getElementById('weatherTemp').textContent = cached.temp;
      document.getElementById('weatherCond').textContent = cached.cond;
      document.getElementById('weatherIcon').textContent = cached.icon;
    } catch {}
  }

  async function fetchWeather() {
    try {
      const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-23.5505&longitude=-46.6333&current_weather=true');
      const data = await res.json();
      if (data && data.current_weather) {
        const temp = Math.round(data.current_weather.temperature);
        const code = data.current_weather.weathercode;
        
        let icon = "☀️";
        let condText = "Ensolarado";
        if (code > 0 && code < 3) { icon = "⛅"; condText = "Parcialmente Nublado"; }
        else if (code >= 3 && code < 50) { icon = "☁️"; condText = "Nublado"; }
        else if (code >= 50) { icon = "🌧️"; condText = "Chuvoso"; }

        const tempStr = `${temp}°C`;
        document.getElementById('weatherTemp').textContent = tempStr;
        document.getElementById('weatherCond').textContent = condText;
        document.getElementById('weatherIcon').textContent = icon;

        localStorage.setItem(WEATHER_CACHE_KEY, JSON.stringify({ temp: tempStr, cond: condText, icon }));
      }
    } catch {
      // Se falhar e não houver nada em cache, só aí avisa que está indisponível
      if (!localStorage.getItem(WEATHER_CACHE_KEY)) {
        document.getElementById('weatherCond').textContent = "Clima indisponível";
      }
    }
  }

  // ===== Descanso de tela =====
  function resetIdleTimer() {
    if (screensaver.classList.contains('active')) {
      dismissScreensaver();
    }
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      screensaver.classList.add('active');
    }, IDLE_TIME_LIMIT);
  }

  function dismissScreensaver() {
    screensaver.classList.remove('active');
    resetIdleTimer();
  }

  // ===== Navegação Espacial via Controle e Ativação por Enter =====
  window.addEventListener('keydown', function(event) {
    resetIdleTimer();
    const active = document.activeElement;
    const isModalOpen = modal.style.display === 'flex' || settingsModal.style.display === 'flex';

    if (event.key === "Escape" || event.key === "Back" || event.keyCode === 10009 || event.keyCode === 461) {
      if (modal.style.display === 'flex') closeModal();
      if (settingsModal.style.display === 'flex') closeSettingsModal();
      return;
    }

    if (isModalOpen) return;

    if ((event.key === "Enter" || event.keyCode === 13) && active && active.classList.contains('tile') && !active.classList.contains('tile-add')) {
      event.preventDefault();
      let apps = getApps();
      const elements = Array.from(document.querySelectorAll('.tile'));
      const index = elements.indexOf(active);
      if (index >= 0 && index < apps.length) {
        launchApp(apps[index]);
      }
      return;
    }

    const elements = Array.from(document.querySelectorAll('.tile, .settings-btn'));
    if (!elements.length) return;

    if (!elements.includes(active)) {
      elements[0].focus();
      return;
    }

    const activeRect = active.getBoundingClientRect();
    let bestCandidate = null;
    let minDistance = Infinity;

    elements.forEach(el => {
      if (el === active) return;
      const rect = el.getBoundingClientRect();

      let isCandidate = false;
      if (event.key === 'ArrowRight') isCandidate = rect.left >= activeRect.right - 10;
      if (event.key === 'ArrowLeft')  isCandidate = rect.right <= activeRect.left + 10;
      if (event.key === 'ArrowDown')  isCandidate = rect.top >= activeRect.bottom - 10;
      if (event.key === 'ArrowUp')    isCandidate = rect.bottom <= activeRect.top + 10;

      if (isCandidate) {
        const dx = (rect.left + rect.width / 2) - (activeRect.left + activeRect.width / 2);
        const dy = (rect.top + rect.height / 2) - (activeRect.top + activeRect.height / 2);
        const distance = dx * dx + dy * dy;

        if (distance < minDistance) {
          minDistance = distance;
          bestCandidate = el;
        }
      }
    });

    if (bestCandidate) {
      event.preventDefault();
      bestCandidate.focus();
    }
  });

  window.onclick = function(event) { 
    resetIdleTimer();
    if (event.target === modal) closeModal(); 
    if (event.target === settingsModal) closeSettingsModal();
  }
  window.onmousemove = resetIdleTimer;

  function pad(n) { return n.toString().padStart(2, '0'); }

  function updateClock() {
    const now = new Date();
    const timeStr = pad(now.getHours()) + ':' + pad(now.getMinutes());
    document.getElementById('clock').textContent = timeStr;
    document.getElementById('ssClock').textContent = timeStr;

    const dias = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
    const meses = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
    const dateStr = dias[now.getDay()] + ', ' + now.getDate() + ' de ' + meses[now.getMonth()];
    
    document.getElementById('date').textContent = dateStr;
    document.getElementById('ssDate').textContent = dateStr;

    const h = now.getHours();
    let greet = 'Boa noite, ';
    if (h >= 5 && h < 12) greet = 'Bom dia, ';
    else if (h >= 12 && h < 18) greet = 'Boa tarde, ';
    
    const userName = getActiveProfile().name;
    document.getElementById('greeting').innerHTML = greet + '<span>' + userName + '</span>';
  }

  applyTheme(getActiveProfile().theme || 'theme-warm');

  updateClock();
  loadCachedWeather();
  fetchWeather();
  setInterval(updateClock, 15000);
  setInterval(fetchWeather, 600000);
  renderApps(); 
  resetIdleTimer();
</script>
