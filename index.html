<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV Box - By Lem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #14110F;
    --bg-glow: #2A1F16;
    --accent-warm: #E8A854;
    --accent-highlight: #F472B6;
    --text-soft: #F5EDE3;
    --text-muted: #A89A8A;
    --tile-radius: 22px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-deep);
    font-family: 'Sora', sans-serif;
  }

  body {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  .glow {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 1400px;
    height: 900px;
    background: radial-gradient(ellipse at center, var(--bg-glow) 0%, transparent 65%);
    opacity: 0.9;
    pointer-events: none;
    z-index: 0;
  }

  .topbar {
    position: absolute;
    top: 32px;
    right: 44px;
    z-index: 2;
    text-align: right;
  }

  .clock {
    font-family: 'Sora', sans-serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--text-soft);
    letter-spacing: 0.5px;
  }

  .date {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 2px;
    text-transform: capitalize;
  }

  .greeting-wrap {
    position: relative;
    z-index: 2;
    text-align: center;
    margin-bottom: 44px;
  }

  .greeting {
    font-family: 'Fredoka', sans-serif;
    font-weight: 500;
    font-size: 40px;
    color: var(--accent-warm);
  }

  .greeting span {
    color: var(--accent-highlight);
  }

  .subtext {
    font-family: 'Fredoka', sans-serif;
    font-size: 16px;
    color: var(--text-muted);
    margin-top: 8px;
  }

  .tiles {
    position: relative;
    z-index: 2;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 24px;
    max-width: 1220px;
  }

  @keyframes popIn {
    0% { opacity: 0; transform: translateY(20px) scale(0.95); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  .tile {
    width: 172px;
    height: 172px;
    border-radius: var(--tile-radius);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: white;
    position: relative;
    overflow: hidden;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    cursor: pointer;
    border: none;
    opacity: 0;
    animation: popIn 0.5s ease forwards;
  }

  .tile::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(160deg, rgba(255,255,255,0.16), rgba(255,255,255,0) 45%);
    pointer-events: none;
  }

  .tile:hover, .tile:focus-visible {
    transform: translateY(-8px) scale(1.045);
    box-shadow: 0 18px 40px rgba(0,0,0,0.5);
    outline: none;
  }

  .tile:focus-visible {
    box-shadow: 0 0 0 4px var(--accent-highlight), 0 18px 40px rgba(0,0,0,0.5);
  }

  .tile-icon {
    font-family: 'Sora', sans-serif;
    font-weight: 800;
    font-size: 32px;
    line-height: 1;
    margin-bottom: 12px;
  }

  .tile-label {
    font-family: 'Sora', sans-serif;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.2px;
    text-align: center;
    padding: 0 8px;
  }

  .delete-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.4);
    color: rgba(255, 255, 255, 0.8);
    border: 1px solid rgba(255, 255, 255, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    cursor: pointer;
    z-index: 5;
    transition: all 0.2s ease;
  }

  .delete-btn:hover, .delete-btn:focus {
    background: #ef4444;
    color: #ffffff;
    border-color: #ef4444;
    transform: scale(1.15);
    outline: none;
  }

  .tile-add {
    background: rgba(255, 255, 255, 0.05);
    border: 2px dashed rgba(255, 255, 255, 0.2);
    color: var(--text-muted);
  }
  
  .tile-add:hover, .tile-add:focus-visible {
    background: rgba(255, 255, 255, 0.1);
    color: var(--text-soft);
  }

  .hint {
    position: relative;
    z-index: 2;
    margin-top: 40px;
    font-family: 'Fredoka', sans-serif;
    font-size: 15px;
    color: var(--text-muted);
    text-align: center;
  }

  /* Frase no canto inferior esquerdo */
  .magic-text {
    position: absolute;
    bottom: 24px;
    left: 32px;
    font-family: 'Fredoka', sans-serif;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.3);
    z-index: 2;
    pointer-events: none;
    letter-spacing: 0.5px;
  }

  .modal-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 999;
  }

  .modal {
    background: #1E1916;
    padding: 30px;
    border-radius: var(--tile-radius);
    width: 400px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.7);
    color: var(--text-soft);
    border: 1px solid rgba(255,255,255,0.1);
  }

  .modal h2 {
    font-family: 'Fredoka', sans-serif;
    margin-bottom: 20px;
    color: var(--accent-highlight);
    text-align: center;
  }

  .modal input {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border-radius: 8px;
    border: 1px solid #3A2F28;
    background: #14110F;
    color: white;
    font-family: 'Sora', sans-serif;
  }

  .modal input:focus {
    outline: 2px solid var(--accent-highlight);
  }

  .modal-buttons {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    margin-top: 10px;
  }

  .modal-btn {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-family: 'Sora', sans-serif;
    font-weight: 600;
  }

  .btn-cancel { background: #3A2F28; color: white; }
  .btn-save { background: var(--accent-highlight); color: #FFF; }

  @media (max-width: 900px) {
    .tile { width: 140px; height: 140px; }
  }
</style>
</head>
<body>

  <div class="glow"></div>

  <div class="topbar">
    <div class="clock" id="clock">--:--</div>
    <div class="date" id="date">--</div>
  </div>

  <div class="greeting-wrap">
    <div class="greeting" id="greeting">Boa tarde, <span>Mãe!</span></div>
    <div class="subtext">O que você quer assistir hoje?</div>
  </div>

  <div class="tiles" id="tiles"></div>

  <div class="hint">Navegue pelas setas do controle e aperte OK para selecionar</div>

  <div class="magic-text">Essa é a magia da programação</div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2>Adicionar Novo Link</h2>
      <input type="text" id="appName" placeholder="Nome (Ex: Receitas)" tabindex="100">
      <input type="text" id="appUrl" placeholder="URL (Ex: https://...)" tabindex="101">
      <div class="modal-buttons">
        <button class="modal-btn btn-cancel" onclick="closeModal()" tabindex="102">Cancelar</button>
        <button class="modal-btn btn-save" onclick="saveApp()" tabindex="103">Salvar</button>
      </div>
    </div>
  </div>

<script>
  const DEFAULT_APPS = [
    { name: "Netflix",     url: "https://www.netflix.com",        initial: "N", grad: ["#C11119", "#7A0A10"] },
    { name: "YouTube",     url: "https://www.youtube.com",        initial: "▶", grad: ["#E8342A", "#8E1A14"] },
    { name: "Globoplay",   url: "https://globoplay.globo.com",    initial: "G", grad: ["#E4265A", "#7A0F30"] },
    { name: "SBT",         url: "https://www.sbt.com.br/ao-vivo", initial: "S", grad: ["#1450A3", "#0A2C5C"] },
    { name: "Internet",    url: "https://www.google.com",         initial: "🌐", grad: ["#E8A854", "#8A5A1E"] },
  ];

  const tilesEl = document.getElementById('tiles');
  const modal = document.getElementById('modalOverlay');

  const gradients = [
    ["#6b21a8", "#3b0764"], ["#047857", "#064e3b"], 
    ["#be123c", "#881337"], ["#1d4ed8", "#1e3a8a"],
    ["#b45309", "#78350f"], ["#4338ca", "#312e81"],
    ["#be185d", "#831843"]
  ];

  function renderApps() {
    tilesEl.innerHTML = ''; 
    let customApps = JSON.parse(localStorage.getItem('tvCustomApps')) || [];

    // Apps Padrão
    DEFAULT_APPS.forEach((app, i) => {
      const a = document.createElement('a');
      a.className = 'tile';
      a.href = app.url;
      a.tabIndex = i + 1;
      a.style.animationDelay = `${i * 0.06}s`;
      a.style.background = `linear-gradient(160deg, ${app.grad[0]}, ${app.grad[1]})`;
      a.innerHTML = `<div class="tile-icon">${app.initial}</div><div class="tile-label">${app.name}</div>`;
      tilesEl.appendChild(a);
    });

    // Apps Personalizados (com botão de deletar)
    const totalDefault = DEFAULT_APPS.length;
    customApps.forEach((app, i) => {
      const index = totalDefault + i;
      const a = document.createElement('a');
      a.className = 'tile';
      a.href = app.url;
      a.tabIndex = index + 1;
      a.style.animationDelay = `${index * 0.06}s`;
      a.style.background = `linear-gradient(160deg, ${app.grad[0]}, ${app.grad[1]})`;
      a.innerHTML = `
        <button class="delete-btn" onclick="deleteApp(${i}, event)" title="Remover link">✕</button>
        <div class="tile-icon">${app.initial}</div>
        <div class="tile-label">${app.name}</div>
      `;
      tilesEl.appendChild(a);
    });

    // Botão Adicionar
    const totalApps = totalDefault + customApps.length;
    const addBtn = document.createElement('button');
    addBtn.className = 'tile tile-add';
    addBtn.tabIndex = totalApps + 1;
    addBtn.style.animationDelay = `${totalApps * 0.06}s`;
    addBtn.onclick = openModal;
    addBtn.innerHTML = `<div class="tile-icon">➕</div><div class="tile-label">Adicionar</div>`;
    tilesEl.appendChild(addBtn);
  }

  function openModal() {
    modal.style.display = 'flex';
    document.getElementById('appName').value = '';
    document.getElementById('appUrl').value = 'https://';
    document.getElementById('appName').focus();
  }

  function closeModal() {
    modal.style.display = 'none';
  }

  function saveApp() {
    const name = document.getElementById('appName').value.trim();
    let url = document.getElementById('appUrl').value.trim();

    if (!name || !url) {
      alert("Por favor, preencha o nome e a URL.");
      return;
    }

    const initial = name.charAt(0).toUpperCase();
    const randomGrad = gradients[Math.floor(Math.random() * gradients.length)];
    const newApp = { name, url, initial, grad: randomGrad };

    let customApps = JSON.parse(localStorage.getItem('tvCustomApps')) || [];
    customApps.push(newApp);
    localStorage.setItem('tvCustomApps', JSON.stringify(customApps));

    closeModal();
    renderApps();
  }

  function deleteApp(customIndex, event) {
    event.preventDefault();
    event.stopPropagation();
    
    if (confirm("Deseja remover este atalho da lista?")) {
      let customApps = JSON.parse(localStorage.getItem('tvCustomApps')) || [];
      customApps.splice(customIndex, 1);
      localStorage.setItem('tvCustomApps', JSON.stringify(customApps));
      renderApps();
    }
  }

  window.onclick = function(event) { if (event.target === modal) closeModal(); }
  window.onkeydown = function(event) { if (event.key === "Escape" && modal.style.display === 'flex') closeModal(); }

  function pad(n) { return n.toString().padStart(2, '0'); }

  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent = pad(now.getHours()) + ':' + pad(now.getMinutes());

    const dias = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
    const meses = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
    document.getElementById('date').textContent =
      dias[now.getDay()] + ', ' + now.getDate() + ' de ' + meses[now.getMonth()];

    const h = now.getHours();
    let greet = 'Boa noite, ';
    if (h >= 5 && h < 12) greet = 'Bom dia, ';
    else if (h >= 12 && h < 18) greet = 'Boa tarde, ';
    
    document.getElementById('greeting').innerHTML = greet + '<span>Mãe!</span>';
  }

  updateClock();
  setInterval(updateClock, 15000);
  renderApps(); 
</script>

</body>
</html>
